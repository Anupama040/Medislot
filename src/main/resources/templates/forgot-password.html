<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MediSlot</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/images/medislot-logo.png}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Forgot Password</h1>
    <p class="muted">Enter your registered email and we'll send you an OTP to reset your password.</p>
    
    <div class="alert danger" th:if="${error}" th:text="${error}"></div>
    
    <form th:action="@{/forgot-password}" method="post" class="form">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="e.g. test@gmail.com">
        
        <button class="button primary" type="submit">Send OTP</button>
    </form>
    
    <p class="switch-link"><a th:href="@{/login}">Back to Login</a></p>
</main>
</body>
</html>
