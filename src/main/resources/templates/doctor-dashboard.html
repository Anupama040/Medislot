<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Doctor Dashboard')}"></head>

<body>
    <nav th:replace="~{fragments :: nav('Doctor Panel')}"></nav>
    <main class="container" style="max-width: 900px; padding: 60px 20px; min-height: calc(100vh - 80px); display: flex; flex-direction: column; justify-content: center; align-items: center;">
        
        <div style="text-align: center; margin-bottom: 40px; width: 100%;">
            <h1 style="color: #1e3a8a; font-size: 2.5rem; margin-bottom: 10px;">Welcome, Dr. <span th:text="${name}"></span></h1>
            <p class="muted" style="font-size: 1.1rem;">Here is your overview for today.</p>
        </div>

        <section class="stats-grid" style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-bottom: 40px;">
            <article class="stat-card" style="background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #f1f5f9;">
                <i class="fa-solid fa-user-check" style="font-size: 2rem; color: #10b981; margin-bottom: 15px;"></i>
                <span style="color: #64748b; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;">Verification</span>
                <strong class="small-strong" th:text="${profile.verificationStatus}" style="color: #1e293b; font-size: 1.5rem;"></strong>
            </article>
            
            <article class="stat-card" style="background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #f1f5f9;">
                <i class="fa-solid fa-calendar-check" style="font-size: 2rem; color: #3b82f6; margin-bottom: 15px;"></i>
                <span style="color: #64748b; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;">Appointments</span>
                <strong th:text="${#lists.size(appointments)}" style="color: #1e293b; font-size: 2.5rem;"></strong>
            </article>
        </section>

        <section class="panel" style="width: 100%; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; text-align: left;">
            <h2 style="color: #1e293b; margin-top: 0; margin-bottom: 25px; display: flex; align-items: center; gap: 10px;"><i class="fa-solid fa-bell" style="color: #f59e0b;"></i> Notifications</h2>
            
            <p th:if="${#lists.isEmpty(notifications)}" class="muted" style="text-align: center; padding: 20px; background: #f8fafc; border-radius: 12px;">No new notifications.</p>
            
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div class="notice" th:each="n : ${notifications}" style="background: #f8fafc; border-left: 4px solid #3b82f6; padding: 20px; border-radius: 8px;">
                    <strong th:text="${n.title}" style="color: #1e293b; display: block; margin-bottom: 5px; font-size: 1.1rem;"></strong>
                    <p th:text="${n.message}" style="margin: 0; color: #475569; line-height: 1.5;"></p>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
