<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MediSlot</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Reset Password</h1>
    <p class="muted">Enter the 6-digit OTP sent to <strong th:text="${email}"></strong></p>
    
    <div class="alert danger" th:if="${error}" th:text="${error}"></div>
    
    <form th:action="@{/reset-password}" method="post" class="form">
        <input type="hidden" name="email" th:value="${email}">
        
        <label>6-Digit OTP</label>
        <input type="text" name="otp" required minlength="6" maxlength="6" pattern="\d{6}" placeholder="123456">
        
        <label>New Password</label>
        <input type="password" name="password" required minlength="6" placeholder="Enter new password">
        
        <button class="button primary" type="submit">Reset Password</button>
    </form>
    
    <p class="switch-link"><a th:href="@{/login}">Back to Login</a></p>
</main>
</body>
</html>
