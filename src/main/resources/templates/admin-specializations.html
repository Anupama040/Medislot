<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Specializations')}">    <link rel="icon" type="image/png" th:href="@{/images/medislot-logo.png}">
</head>
<body class="cyber-page">

    <main class="container" style="max-width: 1200px;">
        <div class="cyber-panel">
            <!-- Inner Header / Nav -->
            <div class="cyber-header">
                <div class="cyber-brand">
                    <img th:src="@{/images/medislot-logo.png}" alt="MediSlot Logo" style="height: 100px; mix-blend-mode: screen; object-fit: contain;">
                </div>
                <div class="cyber-nav">
                    <a th:href="@{/admin/doctors}" class="cyber-nav-btn">Doctors</a>
                    <a th:href="@{/admin/users}" class="cyber-nav-btn">Users</a>
                    <a th:href="@{/admin/specializations}" class="cyber-nav-btn active">Specializations</a>
                    <a th:href="@{/admin/appointments}" class="cyber-nav-btn">Appointments</a>
                    <a th:href="@{/logout}" class="cyber-nav-btn">Logout</a>
                </div>
            </div>

            <div class="welcome-header">
                <h1>Specializations</h1>
            </div>
            
            <div class="alert danger" th:if="${error}" style="margin: 0 15px 15px 15px;">
                <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
            </div>

            <!-- Split Layout for Form and Table -->
            <section class="slots-layout">
                <!-- Left Sidebar: Add Form -->
                <div class="slots-sidebar">
                    <div style="background: rgba(0,0,0,0.5); border: 1px solid cyan; border-radius: 16px; padding: 25px; box-shadow: inset 0 0 15px rgba(0,255,255,0.1);">
                        <h3 style="color: cyan; margin-bottom: 20px;">Add Specialization</h3>
                        <form th:action="@{/admin/specializations}" method="post" class="prescribe-form" style="background: transparent; border: none; padding: 0;">
                            <div class="form-group">
                                <label style="color: cyan;">Name</label>
                                <input name="name" required class="cyber-input" style="width: 100%; border-color: cyan; color: white;">
                            </div>
                            <div class="form-group">
                                <label style="color: cyan;">Description</label>
                                <textarea name="description" rows="3" class="cyber-input" style="width: 100%; border-color: cyan; color: white; resize: vertical;"></textarea>
                            </div>
                            <button type="submit" class="cyber-btn cyber-btn-green" style="width: 100%; margin-top: 10px; padding: 10px;">Add Specialization</button>
                        </form>
                    </div>
                </div>

                <!-- Right Content: Table -->
                <div class="slots-main cyber-table-container">
                    <!-- Header Row -->
                    <div class="cyber-table-header">
                        <div style="flex: 1.5;">NAME</div>
                        <div style="flex: 3;">DESCRIPTION</div>
                        <div style="flex: 1; text-align: center;">STATUS</div>
                    </div>

                    <!-- Data Rows -->
                    <div class="cyber-row" th:each="s : ${specializations}">
                        <div style="flex: 1.5;">
                            <strong th:text="${s.name}" style="color: white; font-size: 1.1rem;"></strong>
                        </div>
                        <div style="flex: 3;">
                            <span class="muted-cyber" th:text="${s.description}"></span>
                        </div>
                        <div style="flex: 1; text-align: center;">
                            <span th:if="${s.active}" class="cyber-badge approved">Active</span>
                            <span th:unless="${s.active}" class="cyber-badge suspended">Inactive</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
