<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('All Appointments')}">    <link rel="icon" type="image/jpeg" th:href="@{/images/favicon.jpg}">
</head>
<body class="cyber-page">

    <main class="container" style="max-width: 1200px;">
        <div class="cyber-panel">
            <!-- Inner Header / Nav -->
            <div class="cyber-header">
                <div class="cyber-brand">
                    <img th:src="@{/images/medislot-logo.png}" alt="MediSlot Logo" style="height: 100px; mix-blend-mode: screen; object-fit: contain;">
                </div>
                <div class="cyber-nav">
                    <a th:href="@{/admin/doctors}" class="cyber-nav-btn">Doctors</a>
                    <a th:href="@{/admin/users}" class="cyber-nav-btn">Users</a>
                    <a th:href="@{/admin/specializations}" class="cyber-nav-btn">Specializations</a>
                    <a th:href="@{/admin/appointments}" class="cyber-nav-btn active">Appointments</a>
                    <a th:href="@{/logout}" class="cyber-nav-btn">Logout</a>
                </div>
            </div>

            <div class="welcome-header">
                <h1>All Appointments</h1>
            </div>

            <!-- Table Container -->
            <div class="cyber-table-container">
                <!-- Header Row -->
                <div class="cyber-table-header">
                    <div style="flex: 1.5;">PATIENT</div>
                    <div style="flex: 1.5;">DOCTOR</div>
                    <div style="flex: 1.5;">DATE & TIME</div>
                    <div style="flex: 2;">REASON</div>
                    <div style="flex: 0.8;">FEE</div>
                    <div style="flex: 1;">STATUS</div>
                </div>

                <!-- Data Rows -->
                <div class="cyber-row" th:each="a : ${appointments}">
                    <div style="flex: 1.5;" class="name-col-flex">
                        <div class="cyber-avatar" style="width: 35px; height: 35px;">
                            <img th:src="@{'https://ui-avatars.com/api/?name=' + ${a.patient.name} + '&background=random&color=fff'}" alt="Patient">
                        </div>
                        <strong th:text="${a.patient.name}"></strong>
                    </div>
                    <div style="flex: 1.5;">
                        <span th:text="${a.doctor.name}"></span>
                    </div>
                    <div style="flex: 1.5;">
                        <span th:text="${a.slot.slotDate}"></span><br>
                        <span class="muted-cyber" th:text="${a.slot.startTime + ' - ' + a.slot.endTime}"></span>
                    </div>
                    <div style="flex: 2;">
                        <span class="muted-cyber" th:text="${a.reason}"></span>
                    </div>
                    <div style="flex: 0.8; font-weight: 600; color: #fff;">
                        <span th:text="${a.fee}"></span>
                    </div>
                    <div style="flex: 1;">
                        <span class="cyber-badge" th:classappend="${a.status.name().toLowerCase()}" th:text="${a.status}"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
